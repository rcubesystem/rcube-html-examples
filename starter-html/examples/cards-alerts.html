<!doctype html>
<!-- Cards, alerts, tooltips, popovers — https://rcube-html.com/cards-alerts -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cards, alerts, tooltips, popovers — rcube-html</title>
</head>
<body style="margin: 0">
  <main style="max-width: 960px; margin: 2rem auto; padding: 0 1rem">
    <h1 style="font: 600 1.5rem system-ui, sans-serif">Cards, alerts, tooltips, popovers</h1>
    <div id="example">Loading…</div>
  </main>
  <script src="../rcube-html/rcube-html.core.js"></script>
  <script>
    const schema = [
      {
        "type": "row",
        "id": "row-1",
        "props": {
          "className": "rc-g-3"
        },
        "children": [
          {
            "type": "column",
            "id": "c-card",
            "props": {
              "className": "rc-col-12 rc-col-md-6"
            },
            "children": [
              {
                "type": "Card",
                "id": "profile-card",
                "props": {
                  "header": "Profile",
                  "title": "Jane Doe",
                  "footer": "Last login: today"
                },
                "children": [
                  {
                    "type": "P",
                    "id": "card-text",
                    "props": {
                      "text": "Cards can hold any nodes, including fields:"
                    }
                  },
                  {
                    "type": "InputField",
                    "id": "card-email",
                    "props": {
                      "type": "email",
                      "name": "cardEmail",
                      "label": "Email"
                    }
                  }
                ]
              }
            ]
          },
          {
            "type": "column",
            "id": "c-alerts",
            "props": {
              "className": "rc-col-12 rc-col-md-6"
            },
            "children": [
              {
                "type": "Alert",
                "id": "notice",
                "props": {
                  "variant": "warning",
                  "heading": "Heads up!",
                  "text": "Close me with ×, then press \"Show alert again\".",
                  "dismissible": true,
                  "onClose": "alertClosed()"
                }
              },
              {
                "type": "Alert",
                "id": "info",
                "props": {
                  "variant": "info",
                  "text": "A plain info alert."
                }
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "id": "row-2",
        "props": {
          "className": "rc-mt-3"
        },
        "children": [
          {
            "type": "column",
            "id": "c-overlays",
            "props": {
              "className": "rc-d-flex rc-flex-wrap rc-gap-2 rc-align-items-start"
            },
            "children": [
              {
                "type": "ButtonField",
                "id": "show-alert",
                "props": {
                  "text": "Show alert again",
                  "onClick": "showAlert()"
                }
              },
              {
                "type": "Tooltip",
                "id": "tip",
                "props": {
                  "text": "I'm a tooltip",
                  "placement": "top"
                },
                "children": [
                  {
                    "type": "ButtonField",
                    "id": "tip-btn",
                    "props": {
                      "text": "Hover me (tooltip)",
                      "variant": "outline-secondary"
                    }
                  }
                ]
              },
              {
                "type": "Popover",
                "id": "pop",
                "props": {
                  "title": "Popover",
                  "text": "Click outside to close.",
                  "placement": "bottom",
                  "trigger": "click"
                },
                "children": [
                  {
                    "type": "ButtonField",
                    "id": "pop-btn",
                    "props": {
                      "text": "Click me (popover)",
                      "variant": "outline-secondary"
                    }
                  }
                ]
              }
            ]
          }
        ]
      }
    ];

    RcubeHtml.mount("#example", {
      schema,
      // the actions the schema names, e.g. "onClick": "save()"
      actions: (api) => ({
        alertClosed: () => console.log("The alert was closed"),
        showAlert: () => api.showNode("notice"),
      }),
    });
  </script>
</body>
</html>
