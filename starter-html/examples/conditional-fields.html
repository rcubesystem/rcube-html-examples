<!doctype html>
<!-- Conditional fields — https://rcube-html.com/conditional-fields -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conditional fields — rcube-html</title>
</head>
<body style="margin: 0">
  <main style="max-width: 960px; margin: 2rem auto; padding: 0 1rem">
    <h1 style="font: 600 1.5rem system-ui, sans-serif">Conditional fields</h1>
    <div id="example">Loading…</div>
  </main>
  <script src="../rcube-html/rcube-html.core.js"></script>
  <script>
    const schema = [
      {
        "type": "row",
        "id": "row-1",
        "children": [
          {
            "type": "column",
            "id": "c-contact",
            "props": {
              "className": "rc-col-12"
            },
            "children": [
              {
                "type": "RadioGroupField",
                "id": "contact-by",
                "props": {
                  "name": "contactBy",
                  "label": "How should we contact you?",
                  "required": true,
                  "options": [
                    "Email",
                    "Phone",
                    "Post"
                  ]
                }
              }
            ]
          },
          {
            "type": "column",
            "id": "c-email",
            "visibleWhen": {
              "field": "contactBy",
              "equals": "Email"
            },
            "props": {
              "className": "rc-col-12 rc-col-md-6"
            },
            "children": [
              {
                "type": "InputField",
                "id": "email",
                "props": {
                  "type": "email",
                  "name": "email",
                  "label": "Email",
                  "required": true
                }
              }
            ]
          },
          {
            "type": "column",
            "id": "c-phone",
            "visibleWhen": {
              "field": "contactBy",
              "equals": "Phone"
            },
            "props": {
              "className": "rc-col-12 rc-col-md-6"
            },
            "children": [
              {
                "type": "InputField",
                "id": "phone",
                "props": {
                  "type": "tel",
                  "name": "phone",
                  "label": "Phone",
                  "required": true,
                  "mask": "(###) ###-####"
                }
              },
              {
                "type": "SelectField",
                "id": "best-time",
                "props": {
                  "name": "bestTime",
                  "label": "Best time to call",
                  "options": [
                    "Morning",
                    "Afternoon",
                    "Evening"
                  ]
                }
              }
            ]
          },
          {
            "type": "column",
            "id": "c-address",
            "visibleWhen": {
              "field": "contactBy",
              "equals": "Post"
            },
            "props": {
              "className": "rc-col-12"
            },
            "children": [
              {
                "type": "TextareaField",
                "id": "address",
                "props": {
                  "name": "address",
                  "label": "Postal address",
                  "rows": 2,
                  "required": true
                }
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "id": "row-2",
        "children": [
          {
            "type": "column",
            "id": "c-extras",
            "props": {
              "className": "rc-col-12 rc-col-md-6"
            },
            "children": [
              {
                "type": "CheckboxGroupField",
                "id": "extras",
                "props": {
                  "name": "extras",
                  "label": "Extras",
                  "options": [
                    "Newsletter",
                    "Special offers"
                  ]
                }
              }
            ]
          },
          {
            "type": "column",
            "id": "c-offer",
            "visibleWhen": {
              "field": "extras",
              "includesAny": [
                "Special offers"
              ]
            },
            "props": {
              "className": "rc-col-12 rc-col-md-6"
            },
            "children": [
              {
                "type": "SelectField",
                "id": "offer-type",
                "props": {
                  "name": "offerType",
                  "label": "Offers about",
                  "required": true,
                  "options": [
                    "Books",
                    "Music",
                    "Travel"
                  ]
                }
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "id": "row-buttons",
        "children": [
          {
            "type": "column",
            "id": "col-buttons",
            "props": {
              "className": "rc-d-flex rc-justify-content-end"
            },
            "children": [
              {
                "type": "ButtonField",
                "id": "submit",
                "props": {
                  "type": "submit",
                  "text": "Submit",
                  "onClick": "runValidation()"
                }
              }
            ]
          }
        ]
      }
    ];

    RcubeHtml.mount("#example", {
      schema,
      onSubmit: ({ entries }) => console.log("Submitted:", entries),
    });
  </script>
</body>
</html>
