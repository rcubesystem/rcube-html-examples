<!doctype html>
<!-- Tabs & accordion — https://rcube-html.com/tabs-accordion -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs & accordion — rcube-html</title>
</head>
<body style="margin: 0">
  <main style="max-width: 960px; margin: 2rem auto; padding: 0 1rem">
    <h1 style="font: 600 1.5rem system-ui, sans-serif">Tabs & accordion</h1>
    <div id="example">Loading…</div>
  </main>
  <script src="../rcube-html/rcube-html.core.js"></script>
  <script>
    const schema = [
      {
        "type": "row",
        "id": "row-tabs",
        "children": [
          {
            "type": "column",
            "id": "c-tabs",
            "children": [
              {
                "type": "Tabs",
                "id": "profile-tabs",
                "props": {
                  "defaultActiveKey": "personal",
                  "onSelect": "tabChanged()"
                },
                "items": [
                  {
                    "key": "personal",
                    "title": "Personal",
                    "children": [
                      {
                        "type": "InputField",
                        "id": "name",
                        "props": {
                          "name": "name",
                          "label": "Name",
                          "required": true
                        }
                      }
                    ]
                  },
                  {
                    "key": "address",
                    "title": "Address",
                    "children": [
                      {
                        "type": "InputField",
                        "id": "city",
                        "props": {
                          "name": "city",
                          "label": "City (required — leave it empty and press Submit)",
                          "required": true
                        }
                      }
                    ]
                  },
                  {
                    "key": "notes",
                    "title": "Notes",
                    "children": [
                      {
                        "type": "TextareaField",
                        "id": "notes",
                        "props": {
                          "name": "notes",
                          "label": "Notes",
                          "rows": 2
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "id": "row-tab-buttons",
        "children": [
          {
            "type": "column",
            "id": "c-tab-buttons",
            "props": {
              "className": "rc-d-flex rc-gap-2 rc-mb-4"
            },
            "children": [
              {
                "type": "ButtonField",
                "id": "go-address",
                "props": {
                  "text": "Go to Address",
                  "variant": "outline-primary",
                  "data-tabs": "profile-tabs",
                  "data-key": "address",
                  "onClick": "selectTab()"
                }
              },
              {
                "type": "ButtonField",
                "id": "go-notes",
                "props": {
                  "text": "Go to Notes (from code)",
                  "variant": "outline-primary",
                  "onClick": "openNotes()"
                }
              },
              {
                "type": "ButtonField",
                "id": "submit",
                "props": {
                  "type": "submit",
                  "text": "Submit",
                  "onClick": "runValidation()"
                }
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "id": "row-accordion",
        "children": [
          {
            "type": "column",
            "id": "c-accordion",
            "children": [
              {
                "type": "Accordion",
                "id": "faq",
                "props": {
                  "defaultActiveKey": "shipping",
                  "alwaysOpen": true,
                  "onSelect": "panelChanged()"
                },
                "items": [
                  {
                    "key": "shipping",
                    "title": "How long does shipping take?",
                    "children": [
                      {
                        "type": "P",
                        "id": "a1",
                        "props": {
                          "text": "Orders ship within 2 business days."
                        }
                      }
                    ]
                  },
                  {
                    "key": "returns",
                    "title": "Can I return an item?",
                    "children": [
                      {
                        "type": "P",
                        "id": "a2",
                        "props": {
                          "text": "Yes, within 30 days."
                        }
                      },
                      {
                        "type": "InputField",
                        "id": "order-no",
                        "props": {
                          "name": "orderNo",
                          "label": "Order number (a field inside a panel)"
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    ];

    RcubeHtml.mount("#example", {
      schema,
      // the actions the schema names, e.g. "onClick": "save()"
      actions: (api) => ({
        tabChanged: ({ eventKey }) => console.log("Tab:", eventKey),
        panelChanged: ({ eventKey }) => console.log("Panel(s):", eventKey),
        openNotes: () => api.selectTab("profile-tabs", "notes"),
      }),
      onSubmit: ({ entries }) => console.log("Submitted:", entries),
    });
  </script>
</body>
</html>
