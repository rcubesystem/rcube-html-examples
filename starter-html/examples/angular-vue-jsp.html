<!doctype html>
<!-- Angular, Vue, JSP & plain HTML — https://rcube-html.com/angular-vue-jsp -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angular, Vue, JSP & plain HTML — rcube-html</title>
</head>
<body style="margin: 0">
  <main style="max-width: 960px; margin: 2rem auto; padding: 0 1rem">
    <h1 style="font: 600 1.5rem system-ui, sans-serif">Angular, Vue, JSP & plain HTML</h1>
    <div id="example">Loading…</div>
  </main>
  <script src="../rcube-html/rcube-html.core.js"></script>
  <script>
    const schema = [
      {
        "type": "row",
        "props": {
          "gap": 3
        },
        "children": [
          {
            "type": "column",
            "props": {
              "span": {
                "xs": 12,
                "md": 6
              }
            },
            "children": [
              {
                "type": "InputField",
                "props": {
                  "name": "email",
                  "label": "Email",
                  "type": "email",
                  "required": true,
                  "placeholder": "you@example.com"
                }
              },
              {
                "type": "InputField",
                "props": {
                  "name": "fullName",
                  "label": "Full name",
                  "required": true
                }
              }
            ]
          },
          {
            "type": "column",
            "props": {
              "span": {
                "xs": 12,
                "md": 6
              }
            },
            "children": [
              {
                "type": "SelectField",
                "props": {
                  "name": "plan",
                  "label": "Plan",
                  "options": [
                    "Basic",
                    "Standard",
                    "Premium"
                  ],
                  "required": true
                }
              },
              {
                "type": "InputField",
                "props": {
                  "name": "terms",
                  "type": "checkbox",
                  "label": "I accept the terms",
                  "required": true
                }
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "props": {
          "className": "rc-mt-2"
        },
        "children": {
          "type": "column",
          "props": {
            "className": "rc-d-flex rc-gap-2"
          },
          "children": [
            {
              "type": "ButtonField",
              "props": {
                "text": "Save",
                "variant": "primary",
                "onClick": "save()"
              }
            },
            {
              "type": "ButtonField",
              "props": {
                "text": "Clear",
                "variant": "outline-secondary",
                "onClick": "clearForm()"
              }
            }
          ]
        }
      },
      {
        "type": "Alert",
        "id": "result",
        "props": {
          "variant": "secondary",
          "text": "Press Save: what each app gets appears here.",
          "className": "rc-mt-3 rc-mb-0"
        }
      }
    ];

    RcubeHtml.mount("#example", {
      schema,
      // the actions the schema names, e.g. "onClick": "save()"
      actions: (api) => ({
        // Save: validate, then show what rcube-submit / (submitted) / @submit would carry
        save: () => {
          const entries = api.runValidation();     // nothing when a field isn't valid
          if (!entries) return;
          api.setNodeProps("result", { variant: "success", text: "event.detail.values = " + JSON.stringify(entries[0]) });
        },
      }),
    });
  </script>
</body>
</html>
