<!doctype html>
<!-- Charts — https://rcube-html.com/charts -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charts — rcube-html</title>
</head>
<body style="margin: 0">
  <main style="max-width: 960px; margin: 2rem auto; padding: 0 1rem">
    <h1 style="font: 600 1.5rem system-ui, sans-serif">Charts</h1>
    <div id="example">Loading…</div>
  </main>
  <script src="../rcube-html/rcube-html.js"></script>
  <script>
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const random = (min, max) => min + Math.floor(Math.random() * (max - min));

    const schema = [
      {
        "type": "row",
        "id": "row-controls",
        "children": [
          {
            "type": "column",
            "id": "c-type",
            "props": {
              "className": "rc-col-12 rc-col-md-4"
            },
            "children": [
              {
                "type": "SelectField",
                "id": "type",
                "props": {
                  "name": "chartType",
                  "label": "Chart type",
                  "defaultValue": "bar",
                  "onChange": "typeChanged()",
                  "options": [
                    {
                      "label": "Bar",
                      "value": "bar"
                    },
                    {
                      "label": "Line",
                      "value": "line"
                    },
                    {
                      "label": "Area",
                      "value": "area"
                    },
                    {
                      "label": "Pie",
                      "value": "pie"
                    },
                    {
                      "label": "Donut",
                      "value": "donut"
                    }
                  ]
                }
              }
            ]
          },
          {
            "type": "column",
            "id": "c-slider",
            "props": {
              "className": "rc-col-12 rc-col-md-4"
            },
            "children": [
              {
                "type": "SliderField",
                "id": "march",
                "props": {
                  "name": "march",
                  "label": "March online sales",
                  "min": 0,
                  "max": 100,
                  "defaultValue": 38,
                  "valueSuffix": "K",
                  "onChange": "marchChanged()"
                }
              }
            ]
          },
          {
            "type": "column",
            "id": "c-switches",
            "props": {
              "className": "rc-col-12 rc-col-md-4 rc-d-flex rc-gap-3 rc-align-items-center"
            },
            "children": [
              {
                "type": "InputField",
                "id": "stacked",
                "props": {
                  "type": "checkbox",
                  "name": "stacked",
                  "label": "Stacked",
                  "onChange": "stackedChanged()"
                }
              },
              {
                "type": "InputField",
                "id": "labels",
                "props": {
                  "type": "checkbox",
                  "name": "labels",
                  "label": "Values",
                  "onChange": "labelsChanged()"
                }
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "id": "row-buttons",
        "children": [
          {
            "type": "column",
            "id": "c-buttons",
            "props": {
              "className": "rc-d-flex rc-flex-wrap rc-gap-2 rc-mb-3"
            },
            "children": [
              {
                "type": "ButtonField",
                "id": "random",
                "props": {
                  "text": "Randomize",
                  "onClick": "randomize()"
                }
              },
              {
                "type": "ButtonField",
                "id": "add",
                "props": {
                  "text": "+ Add month",
                  "onClick": "addMonth()"
                }
              },
              {
                "type": "ButtonField",
                "id": "best",
                "props": {
                  "text": "Highlight best month",
                  "variant": "outline-success",
                  "onClick": "highlightBest()"
                }
              },
              {
                "type": "ButtonField",
                "id": "store",
                "props": {
                  "text": "Show / hide Store",
                  "variant": "outline-secondary",
                  "onClick": "toggleStore()"
                }
              }
            ]
          }
        ]
      },
      {
        "type": "Chart",
        "id": "sales",
        "props": {
          "chartType": "bar",
          "title": "Monthly sales",
          "subtitle": "Thousands of USD",
          "height": 300,
          "labels": [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun"
          ],
          "series": [
            {
              "key": "online",
              "name": "Online",
              "data": [
                42,
                51,
                38,
                64,
                58,
                71
              ]
            },
            {
              "key": "store",
              "name": "Store",
              "data": [
                30,
                28,
                35,
                31,
                40,
                37
              ]
            },
            {
              "key": "target",
              "name": "Target",
              "type": "line",
              "dashed": true,
              "data": [
                45,
                48,
                50,
                55,
                60,
                65
              ]
            }
          ],
          "format": "number",
          "yAxis": {
            "title": "Sales (K)"
          },
          "rulers": [
            {
              "value": 60,
              "label": "Goal",
              "showValue": true
            }
          ],
          "pointRules": [
            {
              "when": {
                "lt": 32
              },
              "color": "#d03b3b"
            }
          ],
          "highlightColor": "#0ca30c",
          "tableToggle": true,
          "onPointClick": "pointClicked()",
          "onLegendClick": "legendClicked()"
        }
      }
    ];

    RcubeHtml.mount("#example", {
      schema,
      // the actions the schema names, e.g. "onClick": "save()"
      actions: (api) => ({
        typeChanged: (event, { value }) => api.setChartType("sales", value || "bar"),
        marchChanged: (event, { value }) => api.setChartValue("sales", "online", "Mar", Number(value)),
        stackedChanged: (event, { value }) => api.setNodeProps("sales", { stacked: value }),
        labelsChanged: (event, { value }) => api.setNodeProps("sales", { dataLabels: value ? "all" : false }),
        randomize: () => {
          const { labels, series } = api.getChartData("sales");
          api.setChartData("sales", { series: series.map((s) => (s.key === "target" ? s : { ...s, data: labels.map(() => random(25, 80)) })) });
        },
        addMonth: () => {
          const { labels } = api.getChartData("sales");
          api.addChartPoint("sales", months[labels.length % 12], { online: random(40, 80), store: random(25, 45), target: 65 }, { max: 12 });
        },
        highlightBest: () => {
          const { series } = api.getChartData("sales");
          const online = series.find((s) => s.key === "online").data;
          api.highlightChart("sales", { series: "online", index: online.indexOf(Math.max(...online)) });
        },
        toggleStore: () => api.toggleSeries("sales", "store"),
        pointClicked: ({ label, seriesName, value }) => console.log(label, seriesName, value),
        legendClicked: ({ series, hidden }) => console.log(series, hidden ? "hidden" : "shown"),
      }),
    });
  </script>
</body>
</html>
