<!doctype html>
<!-- My page — change the schema below, save and reload the page. -->
<!-- My page — https://rcube-html.com/ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My page — rcube-html</title>
</head>
<body style="margin: 0">
  <main style="max-width: 960px; margin: 2rem auto; padding: 0 1rem">
    <h1 style="font: 600 1.5rem system-ui, sans-serif">My page</h1>
    <div id="example">Loading…</div>
  </main>
  <script src="rcube-html/rcube-html.core.js"></script>
  <script>
    const schema = [
      {
        "type": "row",
        "id": "row-title",
        "children": [
          {
            "type": "column",
            "id": "col-title",
            "children": [
              {
                "type": "H4",
                "id": "title",
                "props": {
                  "text": "Sign up"
                }
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "id": "row-fields",
        "children": [
          {
            "type": "column",
            "id": "col-name",
            "props": {
              "className": "rc-col-12 rc-col-md-6"
            },
            "children": [
              {
                "type": "InputField",
                "id": "first",
                "props": {
                  "name": "firstName",
                  "label": "First name",
                  "required": true,
                  "uppercase": true
                }
              }
            ]
          },
          {
            "type": "column",
            "id": "col-email",
            "props": {
              "className": "rc-col-12 rc-col-md-6"
            },
            "children": [
              {
                "type": "InputField",
                "id": "email",
                "props": {
                  "type": "email",
                  "name": "email",
                  "label": "Email",
                  "required": true,
                  "lowercase": true,
                  "pattern": "[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}",
                  "patternMessage": "Please enter a valid email address."
                }
              }
            ]
          }
        ]
      },
      {
        "type": "row",
        "id": "row-buttons",
        "children": [
          {
            "type": "column",
            "id": "col-buttons",
            "props": {
              "className": "rc-d-flex rc-justify-content-end rc-gap-2"
            },
            "children": [
              {
                "type": "ButtonField",
                "id": "clear",
                "props": {
                  "text": "Clear",
                  "onClick": "clearForm()"
                }
              },
              {
                "type": "ButtonField",
                "id": "submit",
                "props": {
                  "type": "submit",
                  "text": "Submit",
                  "onClick": "runValidation()"
                }
              }
            ]
          }
        ]
      }
    ];

    RcubeHtml.mount("#example", {
      schema,
      onSubmit: ({ entries }) => console.log("Submitted:", entries),
    });
  </script>
</body>
</html>
